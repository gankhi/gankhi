<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganki</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-state="{{ state }}">
  <header class="top">
    <h1>Ganki</h1>
    <nav class="tabs" aria-label="Sections">
      <a href="/"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>{{ t('nav_security') }}</a>
      <a href="/inventory"{% if request.endpoint == 'inventory_page' %} aria-current="page"{% endif %}>{{ t('nav_inventory') }}</a>
    </nav>
    <nav class="lang" aria-label="Language">
      <a href="/lang/es"{% if lang == 'es' %} aria-current="true"{% endif %}>ES</a>
      <a href="/lang/en"{% if lang == 'en' %} aria-current="true"{% endif %}>EN</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
